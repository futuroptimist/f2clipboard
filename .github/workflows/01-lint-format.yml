name: Lint & Format
on: [push, pull_request]
jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: uv pip install --system flake8==7.3.0 black==26.5.1 isort==8.0.1
      - run: |
          flake8 .
          isort --check-only .
          black --check .
