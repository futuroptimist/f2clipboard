[project]
name = "f2clipboard"
version = "0.1.0"
description = "Utility for copying selected files to clipboard"
authors = [
    {name = "futuroptimist"}
]
requires-python = ">=3.8"
dependencies = [
    "clipboard",
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx",
    "playwright",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-recording",
    "ruff==0.16.2",
    "flake8==7.3.0",
    "black==26.5.1",
    "isort==8.0.1",
    "pyyaml",
]

[project.scripts]
f2clipboard = "f2clipboard.cli:main"

[project.entry-points."f2clipboard.plugins"]
jira = "f2clipboard.plugins.jira:register"

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "vcr: mark tests that use pytest-recording",
]

[tool.isort]
profile = "black"

[tool.ruff.lint]
ignore = [
    # typer's documented CLI pattern is a call in the argument default
    # (`typer.Option(...)`); it has no side effects and runs once at
    # definition time, so this doesn't apply to how this codebase uses it.
    "B008",
    # Several call sites intentionally catch a broad Exception as a last-
    # resort fallback (LLM API calls, plugin loading, diff formatting) and
    # already log or otherwise handle it; narrowing these would require
    # enumerating every possible httpx/pydantic/plugin exception type for
    # no behavioral benefit.
    "BLE001",
]

[tool.black]
line-length = 88

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
